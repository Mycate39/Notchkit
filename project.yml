# Description du projet pour XcodeGen.
# Régénérer le projet Xcode après modification : `xcodegen generate`
name: Notchkit

options:
  bundleIdPrefix: com.andeolchenaux
  deploymentTarget:
    macOS: "14.0"
  # Anglais par défaut (traduction française dans les catalogues .xcstrings).
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Signature locale (« Sign to Run Locally ») : pas besoin de compte développeur pour l'instant.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    # Versions publiées : certificat auto-signé (gratuit) du trousseau de session, toujours le même,
    # pour que macOS garde les autorisations (Accessibilité…) d'une version à l'autre.
    # Ne jamais supprimer « Notchkit Self-Signed » du trousseau.
    Release:
      CODE_SIGN_IDENTITY: "Notchkit Self-Signed"

# Mises à jour automatiques (Sparkle, licence MIT) : voir Notchkit/App/Updater.swift.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0

targets:
  Notchkit:
    type: application
    platform: macOS
    sources:
      - path: Notchkit
      # Code tiers MediaRemoteAdapter : le script et la licence sont copiés dans les ressources.
      - path: ThirdParty/MediaRemoteAdapter/bin/mediaremote-adapter.pl
        buildPhase: resources
      - path: ThirdParty/MediaRemoteAdapter/LICENSE.txt
        buildPhase: resources
    dependencies:
      - package: Sparkle
      # Le framework est intégré à l'app mais PAS lié : seul le script Perl le charge.
      - target: MediaRemoteAdapter
        link: false
        embed: true
        codeSign: true
    entitlements:
      path: Notchkit/Resources/Notchkit.entitlements
      properties:
        # Nécessaire (avec le Hardened Runtime) pour piloter Music et Spotify par AppleScript.
        com.apple.security.automation.apple-events: true
        # Nécessaires (avec le Hardened Runtime) pour le calendrier et la localisation (météo).
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        # Nécessaire (avec le Hardened Runtime) pour le miroir de la webcam.
        com.apple.security.device.camera: true
    info:
      path: Notchkit/Resources/Info.plist
      properties:
        CFBundleDisplayName: Notchkit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # App d'arrière-plan : pas d'icône dans le Dock, uniquement dans la barre des menus.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Notchkit"
        # Liens notchkit:// : scripts et apps peuvent afficher une progression ou lancer un minuteur.
        CFBundleURLTypes:
          - CFBundleURLName: com.andeolchenaux.notchkit
            CFBundleURLSchemes: [notchkit]
        NSCalendarsFullAccessUsageDescription: "Notchkit shows your upcoming events in the notch and reminds you a few minutes before they start."
        NSCalendarsUsageDescription: "Notchkit shows your upcoming events in the notch and reminds you a few minutes before they start."
        NSLocationUsageDescription: "Notchkit uses your approximate location to show the local weather."
        NSLocationWhenInUseUsageDescription: "Notchkit uses your approximate location to show the local weather."
        NSAudioCaptureUsageDescription: "Notchkit analyzes the sound playing on your Mac to animate the equalizer bars in real time. Audio is never recorded or sent anywhere."
        # Mises à jour (Sparkle) : liste des versions dans le dépôt, clé publique de vérification.
        SUFeedURL: "https://raw.githubusercontent.com/Mycate39/Notchkit/main/appcast.xml"
        SUPublicEDKey: "tisE+cKf5tNeM+4INmuaSM425okZMyXgbhVNIpefFGY="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSAppleEventsUsageDescription: "Notchkit controls playback in Music and Spotify, switches Dark Mode with System Events, and reads the folder open in Terminal for the Git widget."
        NSCameraUsageDescription: "Notchkit shows a mirror view of your camera in the notch, only while the Webcam widget is open. Nothing is recorded."
        NSRemindersFullAccessUsageDescription: "Notchkit shows your reminders in the notch and lets you check them off or add new ones."
        NSRemindersUsageDescription: "Notchkit shows your reminders in the notch and lets you check them off or add new ones."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeolchenaux.notchkit
        MARKETING_VERSION: "0.1.9"
        CURRENT_PROJECT_VERSION: "10"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Framework tiers (BSD 3 clauses) chargé par /usr/bin/perl pour accéder à MediaRemote.
  # Voir ThirdParty/MediaRemoteAdapter/PROVENANCE.md.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: ThirdParty/MediaRemoteAdapter/src
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeolchenaux.notchkit.MediaRemoteAdapter
        PRODUCT_NAME: MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        # Les symboles doivent rester visibles : le script Perl les appelle par leur nom.
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        OTHER_CFLAGS: ["-fvisibility=default"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/MediaRemoteAdapter/src"
          - "$(SRCROOT)/ThirdParty/MediaRemoteAdapter/include"
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        # Code tiers non modifié : on n'affiche pas ses avertissements.
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES

  NotchkitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchkitTests
    dependencies:
      - target: Notchkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeolchenaux.notchkit.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Notchkit:
    build:
      targets:
        Notchkit: all
        NotchkitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotchkitTests
